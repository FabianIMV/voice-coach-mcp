[project]
name = "voice-coach-mcp"
version = "0.1.1"
description = "MCP server that gives Claude ears: local pitch, pronunciation and public-speaking analysis so Claude can coach your voice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FabianIMV" }]
keywords = ["mcp", "claude", "voice", "singing", "pitch", "pronunciation", "public-speaking", "speech", "coach"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "librosa>=1.0",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "pretty_midi>=0.2.11",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2"]
pronunciation = ["torch>=2.4", "transformers>=4.45", "phonemizer>=3.3"]
azure = ["azure-cognitiveservices-speech>=1.40"]

[project.urls]
Homepage = "https://github.com/FabianIMV/voice-coach-mcp"
Repository = "https://github.com/FabianIMV/voice-coach-mcp"
Issues = "https://github.com/FabianIMV/voice-coach-mcp/issues"
Changelog = "https://github.com/FabianIMV/voice-coach-mcp/blob/main/CHANGELOG.md"

[project.scripts]
voice-coach-mcp = "voice_coach_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_coach_mcp"]

# The skill ships inside the package so `voice-coach-mcp package-skill` works from PyPI too.
[tool.hatch.build.targets.wheel.force-include]
"skills/voice-coach" = "voice_coach_mcp/_skill/voice-coach"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter handles line length; long strings are allowed

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: tests that download and run heavy models (whisper, wav2vec2)"]
addopts = "-m 'not models'"
