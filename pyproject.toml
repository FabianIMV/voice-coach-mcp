[project]
name = "voice-coach-mcp"
version = "0.1.0"
description = "Servidor MCP que analiza audio (afinación, pronunciación, discurso) para que Claude actúe como coach de voz."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "librosa>=1.0",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "pretty_midi>=0.2.11",
]

[project.optional-dependencies]
habla = ["faster-whisper>=1.2"]
pronunciacion = ["torch>=2.4", "transformers>=4.45", "phonemizer>=3.3"]
azure = ["azure-cognitiveservices-speech>=1.40"]

[project.scripts]
voice-coach-mcp = "voice_coach_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_coach_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # el formateador controla el largo; los textos largos se permiten

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modelos: tests que descargan y ejecutan modelos pesados (whisper, wav2vec2)"]
addopts = "-m 'not modelos'"

# En Linux (CI) se usa la variante de torch solo-CPU, mucho más liviana; en macOS, la de PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
