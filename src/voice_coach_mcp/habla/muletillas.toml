# Muletillas por idioma. Copia este archivo, edítalo y apunta VOICE_COACH_MULETILLAS a tu copia;
# las secciones que definas reemplazan a las de este archivo.
#
# - vocalizaciones: expresiones regulares para sonidos de relleno (siempre cuentan).
# - expresiones: palabras o frases que siempre cuentan como muletilla.
# - ambiguas: palabras que también tienen uso normal ("este libro", "I like it"); solo cuentan
#   cuando están aisladas: al inicio de una frase, junto a una coma o seguidas/precedidas de una
#   pausa de 0,3 s o más.

[es]
vocalizaciones = ["e+h*m*", "e+m+", "m+", "mh+m*", "a+h+", "a+m+", "u+m+", "h?m+"]
expresiones = ["o sea", "¿no?", "digamos", "es decir", "a ver", "cachai", "¿cachai?", "¿sabes?", "¿me explico?"]
ambiguas = ["este", "esto", "bueno", "pues", "tipo", "entonces", "nada", "como", "vale", "igual", "onda", "básicamente"]

[en]
vocalizaciones = ["u+h+m*", "u+m+", "e+r+m*", "e+h*m+", "h+m+", "m+", "a+h+"]
expresiones = ["you know", "i mean", "sort of", "kind of", "you see", "or something"]
ambiguas = ["like", "so", "well", "basically", "actually", "literally", "right", "okay", "ok", "anyway"]
